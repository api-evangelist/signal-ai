overlay: 1.0.0
info:
  title: API Evangelist enhancements for Signal AI API
  version: 1.0.0
extends: openapi/_original/signal-ai-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: signal-ai
    x-apievangelist-category:
    - Media Intelligence
    - Reputation Management
    - Risk Intelligence
    - Knowledge Graph
    x-apievangelist-auth: oauth2-client-credentials
    x-apievangelist-pagination: cursor
    x-apievangelist-mcp-server: https://mcp.signal-ai.com
- target: $.servers
  update:
    - url: https://api.signal-ai.com
      description: Signal AI production API
- target: $.info
  update:
    x-apievangelist-artifacts:
      authentication: authentication/signal-ai-authentication.yml
      scopes: scopes/signal-ai-scopes.yml
      conventions: conventions/signal-ai-conventions.yml
      data_model: data-model/signal-ai-data-model.yml
      lifecycle: lifecycle/signal-ai-lifecycle.yml
      conformance: conformance/signal-ai-conformance.yml
      changelog: changelog/signal-ai-changelog.yml
      errors: errors/signal-ai-problem-types.yml
      rate_limits: rate-limits/signal-ai-rate-limits.yml
      plans: plans/signal-ai-plans-pricing.yml
      packages: packages/signal-ai-packages.yml
      mcp: mcp/signal-ai-mcp.yml
      tool_crosswalk: mcp/signal-ai-tool-crosswalk.yml
      well_known: well-known/signal-ai-well-known.yml
    x-apievangelist-rate-limit-headers: none-published
    x-apievangelist-error-format: proprietary-errors-array
    x-apievangelist-idempotency: not-supported
    x-apievangelist-generated: '2026-08-13'
