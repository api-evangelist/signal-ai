  published_as: 28/07/2022
  breaking: false
  headline: New Events capability
  additions:
  - Added the new `events` endpoint for monitoring major news events
  - Enabled story-level metrics in the `metrics` endpoint to support volume and sentiment
    analysis of events
- version: v1.2
  date: '2022-06-08'
  published_as: 08/06/2022
  breaking: false
  headline: Improved Search capability
  additions:
  - Added support for `story-id` as a search query criterion
  - Added support for `source.region` and `source.subregion` as search query criteria
- version: v1.1
  date: '2022-02-17'
  published_as: 17/02/2022
  breaking: true
  headline: Improved Affinity capability
  additions:
  - Added the new `POST /affinity` endpoint for querying relationships between concepts
  - Improved the `proximity-score` and `sentiment-score` models for better explainability
    and precision
  deprecations:
  - GET /affinity/entities
  - GET /affinity/topics
  breaking_note: >-
    Deprecated `GET /affinity/entities` and `GET /affinity/topics` in favour of
    `POST /affinity`. Both deprecated paths are absent from the current OpenAPI,
    so they have since been removed outright; no Sunset/Deprecation header
    programme accompanied the removal.
