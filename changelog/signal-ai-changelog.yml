staleness_note: >-
  The published changelog stops at 2023-04-04, yet the live spec has moved since
  this repository last harvested it: a new `Organisation` tag, `GET /users`
  (operationId `list-users`) and a new `manage-organisation` OAuth scope are now
  in https://api.signal-ai.com/openapi.json and appear in NO changelog entry.
  The changelog therefore understates the current surface — an undocumented
  addition rather than an abandoned API.
