notes: >-
  The changelog's newest entry is v1.4 but the OpenAPI document's `info.version`
  still reads `v1.3` — the two disagree, so a consumer reading the machine
  contract is told an older version than the prose. Versions are documentation
  labels only: the API is served from an unversioned host with no version prefix
  in any path and no version request header, and responses carry a
  `signal-version: 1` header (observed 2026-08-13) that does not track these
  point releases. Dates below are recorded as published, in DD/MM/YYYY.
