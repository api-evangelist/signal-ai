method: probed
status: published
source: https://mcp.signal-ai.com/.well-known/oauth-protected-resource
notes: >-
  Signal AI runs an official hosted, remote MCP server at
  https://mcp.signal-ai.com. This round upgraded the evidence from "401 wall" to
  spec-level confirmation: an unauthenticated
  POST https://mcp.signal-ai.com/mcp with a `tools/list` JSON-RPC body returns
  HTTP 401 carrying a correct RFC 9728 challenge —
  `WWW-Authenticate: Bearer resource_metadata="https://mcp.signal-ai.com/.well-known/oauth-protected-resource"` —
  and that metadata document resolves anonymously (HTTP 200), declaring the
  resource, its authorization server and an `mcp:tools` scope. The server is
  therefore a real, correctly-advertised, OAuth-gated remote MCP endpoint. The
  concrete tool list is NOT publicly enumerable: `tools/list` requires a bearer
  token, so the tools[] below remain DERIVED candidates mapped from the public
  OpenAPI operations and may not match the server's actual tool names or input
  schemas. Confirming them requires authenticated introspection with Signal AI
  credentials.
server:
  name: signal-ai
  transport: http
  url: https://mcp.signal-ai.com
  endpoints:
    mcp: https://mcp.signal-ai.com/mcp
    sse: https://mcp.signal-ai.com/sse
  auth: oauth2
  auth_evidence:
  - POST https://mcp.signal-ai.com/mcp {"jsonrpc":"2.0","id":1,"method":"tools/list"}
    -> 401 {"error":"Jwt is missing"} (probed 2026-08-13)
  - 'WWW-Authenticate: Bearer realm="https://mcp.signal-ai.com/mcp"'
  - 'WWW-Authenticate: Bearer resource_metadata="https://mcp.signal-ai.com/.well-known/oauth-protected-resource"'
  - GET https://mcp.signal-ai.com/.well-known/oauth-protected-resource -> 200 (RFC
    9728)
  - GET https://mcp.signal-ai.com/.well-known/oauth-authorization-server -> 200 (RFC
    8414)
  authorization_server: https://login.signal-ai.com/auth/realms/signal
  scopes_supported:
  - openid
  - mcp:tools
  - offline_access
  bearer_methods_supported:
  - header
  docs:
    url: https://mcp.signal-ai.com/docs
    status: 302
    note: Redirects to the Keycloak authorization endpoint — the MCP server's own
      documentation is behind login, so no public tool reference exists.
