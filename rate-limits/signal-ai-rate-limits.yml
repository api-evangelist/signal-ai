exhaustion:
  status_code: 429
  documented_as: >-
    "429 – Too many requests: The server received too many requests in the last
    second or minute."
  retry_guidance: >-
    Not stated in the reference. The first-party `signal-api-tools` client treats
    429 as a retryable (non-fatal) status and backs off.
response_headers:
  documented: false
  observed: []
  notes: >-
    Signal AI documents NO rate-limit response headers — no `X-RateLimit-*`, no
    RFC 9331 `RateLimit-*`, no `Retry-After`. An unauthenticated
    GET https://api.signal-ai.com/topics (probed 2026-08-13, HTTP 401) returned
    only `signal-version: 1` plus standard Cloudflare/security headers, so no
    runtime budget signal could be observed anonymously either. A client cannot
    see how much of its per-second/per-minute allowance remains; it can only
    count its own calls against the published table or wait for a 429. This is
    the gap between a documented limit and an agent-usable one.
