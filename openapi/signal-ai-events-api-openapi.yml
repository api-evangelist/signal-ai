openapi: 3.2.0
info:
  title: Signal AI Events API
  description: '# Overview


    The Signal AI API is an HTTP+JSON API offering programmatic access to Signal AI''s decision augmentation platform.'
  version: v1.3
servers:
- url: https://api.signal-ai.com
security:
- OAuth2:
  - default
tags:
- name: Events
  description: The Events API endpoint identifies significant clusters of news coverage about entities and topics of interest, allowing users to easily identify news events that could impact them or their business, and offering a qualitative deep dive into the quantitative data provided by Metrics and Affinity.
paths:
  /events/{hash}:
    get:
      operationId: get-event-by-hash
      tags:
      - Events
      summary: Returns the Event for this hash
      parameters:
      - name: hash
        required: true
        in: path
        schema:
          $ref: '#/components/schemas/EventHash'
      responses:
        '200':
          description: Event's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventHashResponse'
              examples:
                event-hash-response:
                  $ref: '#/components/examples/event-hash-response-example'
  /events:
    post:
      operationId: search-events
      security:
      - OAuth2:
        - events
      tags:
      - Events
      summary: Events Search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSearchQuery'
            examples:
              events-request:
                $ref: '#/components/examples/events-request-example'
      responses:
        '200':
          description: Returns a list of events matching the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSearchResponse'
              examples:
                events-response:
                  $ref: '#/components/examples/events-response-example'
components:
  schemas:
    EventHashResponse:
      type: object
      required:
      - event
      additionalProperties: false
      properties:
        event:
          type: object
          unevaluatedProperties: false
          allOf:
          - $ref: '#/components/schemas/Event'
          - required:
            - source-ids
            properties:
              source-ids:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceId'
                description: The sources that mention this event.
    ResourceId:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      example: bcd2d868-ed38-4382-b94a-622a30fc3215
    Entity:
      type: object
      required:
      - id
      - name
      - type
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        type:
          $ref: '#/components/schemas/EntityType'
        name:
          type: string
    EventEntitiesMatch:
      type: object
      additionalProperties: false
      required:
      - id
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/AnyOrAllResourceIdsMatch'
          - properties:
              any:
                type: array
                maxItems: 200
              all:
                type: array
                maxItems: 200
    AllResourceIds:
      type: object
      additionalProperties: false
      required:
      - all
      properties:
        all:
          $ref: '#/components/schemas/ResourceIds'
    EventMatch:
      type: object
      additionalProperties: false
      properties:
        date:
          type: object
          properties:
            gt:
              $ref: '#/components/schemas/Date'
            gte:
              $ref: '#/components/schemas/Date'
            lt:
              $ref: '#/components/schemas/Date'
            lte:
              $ref: '#/components/schemas/Date'
          additionalProperties: false
          minProperties: 1
          dependentSchemas:
            gt:
              not:
                required:
                - gte
            gte:
              not:
                required:
                - gt
            lt:
              not:
                required:
                - lte
            lte:
              not:
                required:
                - lt
        topics:
          $ref: '#/components/schemas/EventTopicsMatch'
        entities:
          $ref: '#/components/schemas/EventEntitiesMatch'
        labels:
          type: object
          description: Filter on specific words or phrases. A label can contain a maximum of 6 words.
          oneOf:
          - additionalProperties: false
            properties:
              any:
                type: array
                items:
                  type: string
                maxItems: 100
          - additionalProperties: false
            properties:
              all:
                type: array
                items:
                  type: string
                maxItems: 100
        sources:
          type: object
          additionalProperties: false
          required:
          - id
          description: If the user does not have access to any of the sources specified, those ids will be excluded while fetching the events
          properties:
            id:
              allOf:
              - $ref: '#/components/schemas/AnyOrAllResourceIdsMatch'
              - properties:
                  any:
                    maxItems: 100
                  all:
                    maxItems: 100
    EventTopicsMatch:
      type: object
      additionalProperties: false
      required:
      - id
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/AnyOrAllResourceIdsMatch'
          - properties:
              any:
                maxItems: 100
              all:
                maxItems: 100
    EventEntity:
      type: object
      allOf:
      - $ref: '#/components/schemas/Entity'
      - properties:
          story-count:
            type: integer
          prominence-score:
            type: number
            description: The number of stories mentioning the concept divided by the story count for the event. For example, if half the stories in the event mention an entity then the prominence would be 0.5.
    EventTopic:
      type: object
      allOf:
      - $ref: '#/components/schemas/PartialTopic'
      - properties:
          story-count:
            type: integer
          prominence-score:
            type: number
            description: The number of stories mentioning the concept divided by the story count for the event. For example, if half the stories in the event mention a topic then the prominence would be 0.5.
    Date:
      type: string
      format: date
      description: "A date based on the IETF RFC 3339 format (e.g. `2023-01-01`).\n    Note that a day is the span of time between 00:00:00 and 23:59:59 based on\n    the UTC timezone. You may prefer using the `date-time` option to match days\n    in a different timezone."
      example: '2023-01-01'
    ResourceIds:
      type: array
      items:
        $ref: '#/components/schemas/ResourceId'
    Event:
      type: object
      required:
      - hash
      - date
      - story-count-global
      - document-count-entitlements
      - document-count-global
      - labels
      - entities
      - topics
      - story-ids
      properties:
        labels:
          type: array
          items:
            type: string
          description: The most descriptive words or phrases that appear in the documents in the event.
        date:
          $ref: '#/components/schemas/Date'
        document-count-entitlements:
          type: integer
          description: The number of documents that mentioned this event based on your user permissions.
        hash:
          $ref: '#/components/schemas/EventHash'
        story-count-global:
          type: integer
          description: The number of stories that mentioned this event across Signal's global data set.
        story-ids:
          type: array
          description: Ordered by centrality - how well the story represents the event in question. You can use these ids in the [Search API](#tag/Content-Search/operation/search-documents) to get headlines best describing the event.
          items:
            $ref: '#/components/schemas/ResourceId'
        document-count-global:
          type: integer
          description: The number of documents that mentioned this event across Signal's global data set.
        entities:
          type: array
          items:
            $ref: '#/components/schemas/EventEntity'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/EventTopic'
        source-count-global:
          oneOf:
          - type: integer
          - type: 'null'
          description: The number of sources that mentioned this event across Signal's global data set.
    EventExclude:
      type: object
      additionalProperties: false
      properties:
        entities:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              allOf:
              - $ref: '#/components/schemas/AnyResourceIds'
              - properties:
                  any:
                    maxItems: 100
        topics:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              allOf:
              - $ref: '#/components/schemas/AnyResourceIds'
              - properties:
                  any:
                    maxItems: 50
        labels:
          type: object
          additionalProperties: false
          properties:
            any:
              type: array
              items:
                type: string
              maxItems: 100
        sources:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              allOf:
              - $ref: '#/components/schemas/AnyResourceIds'
              - properties:
                  any:
                    maxItems: 100
    PartialTopic:
      type: object
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
    EntityType:
      type: string
      enum:
      - person
      - organisation
      - location
      - substance
      - disease
      - product
      - regulation
    EventSearchResponse:
      type: object
      required:
      - events
      - event-hash-expiry
      - stats
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            unevaluatedProperties: false
            $ref: '#/components/schemas/Event'
        event-hash-expiry:
          type: string
          format: date-time
          description: When the event hashes will expire (note that it could still be available after this time).
        next-cursor:
          oneOf:
          - $ref: '#/components/schemas/Base64String'
          - type: 'null'
          description: Use the value of this field as the input to `from-cursor` in a query to paginate through the results (see [Pagination](#section/Pagination)).
        stats:
          type: object
          description: The number of events matched across our entire data set. We can only provide an accurate figure up to 10000. Anything above that is indicated with `gte`.
          required:
          - total
          properties:
            total:
              type: array
              prefixItems:
              - enum:
                - eq
                - gte
              - type: integer
    EventSearchQuery:
      type: object
      required:
      - where
      additionalProperties: false
      properties:
        where:
          $ref: '#/components/schemas/EventMatch'
        exclude:
          $ref: '#/components/schemas/EventExclude'
        size:
          type: integer
          default: 10
          minimum: 0
          maximum: 1000
        from-cursor:
          $ref: '#/components/schemas/Base64String'
          description: Use this field to paginate through the results (see [Pagination](#section/Pagination)).
    EventHash:
      type: string
      pattern: '[0-9a-fA-F=-]+'
    AnyOrAllResourceIdsMatch:
      oneOf:
      - $ref: '#/components/schemas/AnyResourceIds'
      - $ref: '#/components/schemas/AllResourceIds'
    AnyResourceIds:
      type: object
      additionalProperties: false
      required:
      - any
      properties:
        any:
          $ref: '#/components/schemas/ResourceIds'
    Base64String:
      type: string
      pattern: ^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{2}==)?$
      example: RjQ2RTRBQUEtQTNGRi00MEI3LUE1NEYtNTA0NEQxMjc5NkU3
