aid: signal-ai
name: Signal AI
description: >-
  Signal AI (Signal Media Ltd) is an AI-powered reputation and risk intelligence
  platform that turns the world's largest real-time dataset of global news, social,
  broadcast and regulatory content into actionable insight. Its proprietary AIQ
  framework understands, enriches and surfaces relevant coverage across 226 markets
  and 120+ languages, ingesting 5.5M+ articles and labelling 100M+ entities and topics
  daily. The Signal AI API is an HTTP+JSON API offering programmatic access to the
  platform via Content Search, Content Metrics, Affinity (the Signal AI Knowledge
  Graph), Events, and Risk Events endpoints, secured with OAuth2 client-credentials.
