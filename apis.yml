- aid: signal-ai:signal-ai-events-api
  name: Signal AI Events API
  description: >-
    The Events API endpoint identifies significant clusters of news coverage about entities and topics
    of interest, allowing users to easily identify news events that could impact them or their business,
    and offering a qualitative deep dive into the quantitative data provided by Metrics and Affinity.
    By leveraging the 15-month archive, users can easily get up to speed on the recent developments involving
    specific companies, industries or topics.


    Examples of questions this data can answer include:


    * Have there been any events involving Company X in the past day/month/year/15 months?

    * What are the latest developments in the food and beverage industry?

    * Have there been any product recalls recently?


    The data returned includes entities and topics involved, their prominence scores, alongside the number
    of stories describing the event (a measure of "newsworthiness"), and a group of the most descriptive
    labels.


    The data is generated daily.


    ## Event hashes

    Each event contains a `hash` field. You can look up events by hash using the `/events/{hash}` endpoint.
    The difference between the data returned in this endpoint compared with `/events` is as follows:


    * All story ids for the event are returned not just the top 100

    * The source ids for the event are included


    In APIs it's more common to use the term "id" rather than "hash". We've chosen to use "hash" because
    these strings can change as we receive new data. In the `/events` endpoint the `event-hash-expiry`
    field indicates when the hash will expire. Note that it could still be available after this time.
